name: Stage npm package

# This workflow stages an existing draft-release tarball. It never makes the
# npm package or GitHub Release public. A maintainer must review and approve the
# staged package separately with npm two-factor authentication.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag whose draft asset should be staged
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-stage-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Verify draft release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      attestations: read
      contents: write
    outputs:
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      checksum: ${{ steps.release.outputs.checksum }}
      distribution_tag: ${{ steps.release.outputs.distribution_tag }}
      package: ${{ steps.release.outputs.package }}

    steps:
      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Enable the pinned npm version
        run: corepack enable

      - name: Validate the selected release
        id: release
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          version="$(node --input-type=module --eval \
            'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.version);')"
          expected_npm="$(node --input-type=module --eval \
            'import manifest from "./package.json" with { type: "json" }; process.stdout.write(manifest.packageManager.split("@").at(-1));')"

          if [[ "${GITHUB_REF_TYPE}" != "branch" || "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Run this workflow from the default branch ${DEFAULT_BRANCH}." >&2
            exit 1
          fi

          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "Tag ${RELEASE_TAG} does not match package version ${version}." >&2
            exit 1
          fi

          if [[ "$(git cat-file -t "${RELEASE_TAG}")" != "tag" ]]; then
            echo "Release tag ${RELEASE_TAG} must be annotated." >&2
            exit 1
          fi

          if [[ "$(git rev-list -n 1 "${RELEASE_TAG}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Checked-out commit does not match release tag ${RELEASE_TAG}." >&2
            exit 1
          fi

          if [[ "$(git for-each-ref --format='%(taggername)' "refs/tags/${RELEASE_TAG}")" != "tecto" ]]; then
            echo "Release tag ${RELEASE_TAG} does not use the tecto publication identity." >&2
            exit 1
          fi

          tag_object="$(git rev-parse "${RELEASE_TAG}^{tag}")"
          if [[ "$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
            --jq .verification.verified)" != "true" ]]; then
            echo "GitHub did not verify the signature for release tag ${RELEASE_TAG}." >&2
            exit 1
          fi

          if [[ "$(corepack npm --version)" != "${expected_npm}" ]]; then
            echo "Corepack did not select npm ${expected_npm}." >&2
            exit 1
          fi

          if [[ "$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json isDraft --jq .isDraft)" != "true" ]]; then
            echo "Release ${RELEASE_TAG} must exist as a draft." >&2
            exit 1
          fi

          package="hypertectonic-walk-me-through-the-code-${version}.tgz"
          checksum="${package}.sha256"
          distribution_tag="latest"
          if [[ "${version}" == *-* ]]; then
            distribution_tag="next"
          fi

          {
            echo "artifact_name=npm-stage-${RELEASE_TAG}"
            echo "version=${version}"
            echo "package=${package}"
            echo "checksum=${checksum}"
            echo "distribution_tag=${distribution_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download and verify the immutable draft asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHECKSUM: ${{ steps.release.outputs.checksum }}
          RELEASE_PACKAGE: ${{ steps.release.outputs.package }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          candidate="${RUNNER_TEMP}/npm-stage"
          mkdir "${candidate}"
          gh release download "${RELEASE_TAG}" \
            --dir "${candidate}" \
            --pattern "${RELEASE_PACKAGE}" \
            --pattern "${RELEASE_CHECKSUM}" \
            --repo "${GITHUB_REPOSITORY}"

          cd "${candidate}"
          sha256sum --check "${RELEASE_CHECKSUM}"
          gh attestation verify "${RELEASE_PACKAGE}" --repo "${GITHUB_REPOSITORY}"

      - name: Transfer the verified package to the staging job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/npm-stage/${{ steps.release.outputs.package }}
            ${{ runner.temp }}/npm-stage/${{ steps.release.outputs.checksum }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  stage:
    name: Stage reviewed package
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the selected tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Enable the pinned npm version
        run: corepack enable

      - name: Download the verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: ${{ runner.temp }}/npm-stage

      - name: Verify the transferred package
        shell: bash
        env:
          RELEASE_CHECKSUM: ${{ needs.prepare.outputs.checksum }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/npm-stage"
          sha256sum --check "${RELEASE_CHECKSUM}"

      - name: Stage the exact package for manual npm review
        shell: bash
        env:
          RELEASE_DISTRIBUTION_TAG: ${{ needs.prepare.outputs.distribution_tag }}
          RELEASE_PACKAGE: ${{ needs.prepare.outputs.package }}
        run: |
          set -euo pipefail

          cd "${RUNNER_TEMP}/npm-stage"
          corepack npm stage publish "./${RELEASE_PACKAGE}" \
            --access public \
            --tag "${RELEASE_DISTRIBUTION_TAG}"
