      <path d="M380 506C535 506 562 505 653 505c112 0 110 0 218 0 112 0 121-179 237-179 118 0 123 102 225 102 93 0 87-189 181-189" fill="none" stroke="url(#path2)" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g transform="translate(380 335) rotate(-4)" filter="url(#shadow2)">
      <rect width="235" height="164" rx="20" fill="#1D2E29"/>
      <rect width="235" height="38" rx="20" fill="#283D36"/>
      <path d="M0 38h235" stroke="#3B534B"/>
      <circle cx="20" cy="19" r="4" fill="#ED936A"/>
      <circle cx="34" cy="19" r="4" fill="#EFC968"/>
      <circle cx="48" cy="19" r="4" fill="#62C99A"/>
