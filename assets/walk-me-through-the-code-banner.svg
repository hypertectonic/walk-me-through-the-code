      <text x="36" y="80" font-size="13" font-weight="680" fill="#2A5D4B">router.ts · lines 42-49</text>
      <text x="22" y="127" font-size="16" font-weight="680" fill="#2D3E37">Why does this branch</text>
      <text x="22" y="149" font-size="16" font-weight="680" fill="#2D3E37">return early?</text>
      <text x="130" y="209" text-anchor="middle" font-size="14" font-weight="760" letter-spacing=".35" fill="#725541">03 · ASK THE NEXT QUESTION</text>
