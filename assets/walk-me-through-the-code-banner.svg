<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Walk Me Through the Code - guided path</title>
  <desc id="desc">A banner depicting an illuminated path through source files, explanation steps, and a follow-up question.</desc>
  <defs>
    <linearGradient id="bg2" x1="80" y1="0" x2="1530" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9E9"/>
      <stop offset="0.48" stop-color="#F4EDDC"/>
      <stop offset="1" stop-color="#E0F0E7"/>
    </linearGradient>
    <linearGradient id="path2" x1="570" y1="470" x2="1500" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ED936A"/>
      <stop offset="0.52" stop-color="#D4AD48"/>
      <stop offset="1" stop-color="#2AA378"/>
    </linearGradient>
    <filter id="shadow2" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#574831" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="640" rx="30" fill="url(#bg2)"/>
  <path d="M0 538C250 475 345 585 560 522c260-77 420-22 610-104 173-74 287-179 430-211v433H0Z" fill="#FFFFFF" opacity=".38"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(78 76)">
