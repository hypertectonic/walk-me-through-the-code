      <rect x="36" y="124" width="144" height="6" rx="3" fill="#C4F2DD"/>
      <text x="117.5" y="197" text-anchor="middle" font-size="14" font-weight="760" letter-spacing=".35" fill="#725541">01 · TRACE THE PATH</text>
    </g>

    <g transform="translate(830 381) rotate(3)" filter="url(#shadow2)">
