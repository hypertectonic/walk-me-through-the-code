      <rect x="20" y="20" width="48" height="48" rx="15" fill="#FFF0C9"/>
      <text x="38" y="52" font-size="22" font-weight="800" fill="#A86C13">2</text>
      <text x="82" y="40" font-size="12" font-weight="780" letter-spacing=".25" fill="#946D20">EXECUTION STEP</text>
      <text x="82" y="63" font-size="16" font-weight="720" fill="#2E4138">The request enters</text>
      <rect x="20" y="92" width="204" height="7" rx="3.5" fill="#CBD7D1"/>
      <rect x="20" y="112" width="166" height="7" rx="3.5" fill="#CBD7D1"/>
      <rect x="20" y="132" width="218" height="7" rx="3.5" fill="#6DBB99"/>
      <text x="130" y="203" text-anchor="middle" font-size="14" font-weight="760" letter-spacing=".35" fill="#725541">02 · STEP THROUGH THE FLOW</text>
