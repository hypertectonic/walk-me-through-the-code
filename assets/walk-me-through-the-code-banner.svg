      <text y="84" font-size="72" font-weight="780" letter-spacing="-3.8" fill="#263B31">Walk Me Through</text>
      <text y="160" font-size="72" font-weight="780" letter-spacing="-3.8" fill="#263B31">the Code</text>
      <text y="215" font-size="23" font-weight="520" fill="#5C6E63">Start with a question. Keep every step tied to source.</text>
    </g>

